name: document-and-deploy

# Regenerates the roxygen documentation (committed on pushes) and deploys the Shiny
# explorer from main and releases. The website is built and deployed by pkgdown.yml.

on:
  push:
  pull_request:
  release:

jobs:
  document-and-deploy:
    # Skip commits made by this and the data-update workflow (author actions@github.com),
    # so a merge whose squash message lists an "[automated]" commit still deploys.
    # To skip deliberately, start the commit message with "[no-deploy]".
    if: >-
      github.event.head_commit.author.email != 'actions@github.com' &&
      !startsWith(github.event.head_commit.message, '[no-deploy]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R version
        uses: r-lib/actions/setup-r@v2
        with:
          #r-version: "oldrel" # Sometimes needed when shinyapps.io needs time to catch up after releases
          use-public-rspm: true

      - name: Set up R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: devtools, roxygen2, remotes, rsconnect

      - name: Create documentation
        run: |
          R -e "
            file.remove('NAMESPACE');
            descr <- readLines('DESCRIPTION');
            descr <- stringr::str_replace(descr, '^Date.*$', paste('Date:', Sys.Date()));
            writeLines(descr, 'DESCRIPTION');
            roxygen2::roxygenise();
            try(devtools::build_manual())
          "

      - name: commit
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f man/\* NAMESPACE
          git commit -m 'Documentation [automated]' || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes to commit"

      # Deploy only from main (pull requests and other branches must not replace the live app)
      - name: Deploy to Shiny
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R -e "
            remotes::install_github('${{ github.repository }}', ref = '${{ github.sha }}', force = TRUE);
            rsconnect::setAccountInfo(name='forrt-replications', token=${{secrets.SHINYAPPS_TOKEN}}, secret=${{secrets.SHINYAPPS_SECRET}});
            rsconnect::deployApp(appName = 'fred_explorer', appDir = './inst/fred_explorer', forceUpdate = TRUE);
          "

      - name: Deploy release version conditionally
        if: github.event_name == 'release' && !contains(github.event.release.tag_name, 'test')
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R -e "
              remotes::install_github('${{ github.repository }}', ref = '${{ github.sha }}', force = TRUE);
              rsconnect::setAccountInfo(name='forrt-replications', token=${{secrets.SHINYAPPS_TOKEN}}, secret=${{secrets.SHINYAPPS_SECRET}});
              rsconnect::deployApp(appName = 'fred_explorer_release', appDir = './inst/fred_explorer', forceUpdate = TRUE);
          "
